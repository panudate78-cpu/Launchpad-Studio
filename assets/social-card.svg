<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Launchpad Studio — Professional websites for local businesses">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1E3B"/>
      <stop offset="0.55" stop-color="#0A1730"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.1" r="0.66" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0.36"/>
      <stop offset="0.62" stop-color="#FF6B35" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.78" gradientUnits="objectBoundingBox">
      <stop offset="0.55" stop-color="#071426" stop-opacity="0"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0.62"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.4" fill="#FFFFFF" fill-opacity="0.09"/>
    </pattern>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A5C"/>
      <stop offset="1" stop-color="#E85A28"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Right-side launch motif -->
  <g fill="none" stroke-linecap="round">
    <circle cx="1052" cy="300" r="150" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="1052" cy="300" r="206" stroke="#FF6B35" stroke-opacity="0.14"/>
    <circle cx="1052" cy="300" r="264" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <circle cx="1052" cy="300" r="324" stroke="#FF6B35" stroke-opacity="0.08"/>
  </g>
  <rect x="880" y="430" width="300" height="180" fill="url(#dots)" opacity="0.55"/>

  <!-- Vignette -->
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Logo mark (orange rounded square + white rocket) -->
  <g transform="translate(96 72)">
    <rect width="64" height="64" rx="18" fill="url(#markGrad)"/>
    <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.28"/>
    <g transform="translate(8 4)">
      <polygon points="24,2 31,10 17,10" fill="#FFFFFF"/>
      <rect x="17" y="9" width="14" height="21" rx="7" fill="#FFFFFF"/>
      <circle cx="24" cy="17" r="4.5" fill="#FF6B35"/>
      <polygon points="17,25 5,36 17,31" fill="#FFFFFF"/>
      <polygon points="31,25 43,36 31,31" fill="#FFFFFF"/>
      <polygon points="21,31 24,42 27,31" fill="#FFE3D3"/>
    </g>
  </g>

  <!-- Eyebrow -->
  <circle cx="96" cy="222" r="5" fill="#FF6B35"/>
  <text x="112" y="228" font-family="Inter" font-weight="600" font-size="20" letter-spacing="3" fill="#FFFFFF" fill-opacity="0.72">WEBSITE DESIGN · SURREY &amp; SOUTH WEST LONDON</text>

  <!-- Headline -->
  <text x="94" y="356" font-family="Fraunces" font-weight="700" font-size="104" fill="#FFFFFF">Launchpad Studio</text>

  <!-- Tagline -->
  <text x="96" y="440" font-family="Inter" font-weight="600" font-size="38" fill="#FFFFFF" fill-opacity="0.96">Professional Websites for Local Businesses</text>

  <!-- Supporting line -->
  <text x="96" y="486" font-family="Inter" font-weight="400" font-size="22" fill="#FFFFFF" fill-opacity="0.6">Websites that get you found, trusted and booked.</text>

  <!-- Domain -->
  <text x="96" y="562" font-family="Inter" font-weight="600" font-size="22" letter-spacing="0.5" fill="#FFFFFF" fill-opacity="0.45">launchpadstudio.uk</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#markGrad)"/>
</svg>
